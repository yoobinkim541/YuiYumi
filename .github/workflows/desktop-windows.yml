# Builds the Windows desktop app (NSIS installer) and attaches it to a GitHub release.
# Public assets (encrypted model packs, character core, voice clips) come from the web
# deployment, so the private model sources are never needed here. The coding-agent runtime
# bundle is macOS-only for now, so the Windows build ships without it.
name: Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (e.g. v0.1.1)
        required: true
      api_base:
        description: Deployment the app talks to
        default: https://yuiyumi-seven.vercel.app

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Fetch public assets from the deployment
        run: node scripts/fetch-public-assets.mjs ${{ inputs.api_base }}
      - name: Build the installer
        env:
          DESKTOP_API_BASE: ${{ inputs.api_base }}
          YUIYUMI_AGENT_BUNDLE: '0'
        run: pnpm desktop:build --bundles nsis
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" src-tauri/target/release/bundle/nsis/*.exe --clobber
