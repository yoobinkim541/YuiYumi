[package]
name = "yuiyumi-desktop"
version = "0.1.0"
description = "YuiYumi desktop overlay"
edition = "2021"
publish = false

[lib]
name = "yuiyumi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
open = "5"
url = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString", "NSDictionary", "NSValue", "NSProcessInfo", "NSBundle", "NSFileManager", "NSGeometry", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFData", "CFDictionary", "CFString", "CFNumber", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGDataProvider", "CGDirectDisplay", "CGWindow", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "block2", "objc2-core-graphics"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
